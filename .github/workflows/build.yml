name: SkinSwitch Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Capes and Build Mod
        working-directory: ./skinswitch
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Show Downloaded Capes
        if: always()
        working-directory: ./skinswitch
        run: |
          FILE="build/generated/capes/assets/skinswitch/capes/index.txt"
          if [ -f "$FILE" ]; then
            echo "Downloaded capes:"
            cat "$FILE"
          else
            echo "Capes index not found"
          fi

      - name: Upload SkinSwitch Mod
        uses: actions/upload-artifact@v4
        with:
          name: SkinSwitch-Mod
          path: skinswitch/build/libs/*.jar
          if-no-files-found: error
